# StudyWiser Ops — local Supabase configuration.
# This defines the ISOLATED Ops Supabase project (separate from the tutoring App).
# `supabase start` uses these settings for local development.
project_id = "studywiser-ops"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/reset-password",
  "http://localhost:3000/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local dev convenience: skip email confirmation so seeded/dev accounts work
# immediately. In production this should be TRUE and email delivery configured.
enable_confirmations = false
secure_password_change = false

[auth.email.template]

[analytics]
enabled = false
